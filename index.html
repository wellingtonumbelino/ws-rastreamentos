<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WS Rastreamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header>
      <nav id="main-menu" class="main-menu">
        <div class="menu-logo">
          <h1>WS Rastreamento</h1>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero-section">
        <h1>Rastreio prático, rápido e transparente</h1>
        <span>Acompanhe sua encomenda em tempo real.</span>
      </section>

      <section class="tracking-search-section">
        <div class="tracking-search-container">
          <input
            type="text"
            placeholder="Digite seu código (ex: WS923874923BR)"
          />
          <button class="btn-primary" id="trk-btn">Consultar</button>
        </div>
      </section>

      <section class="tracking-results-section">
        <div class="tracking-results-container">
          <div class="tracking-status-container">
            <div class="tracking-location">
              <h1>Location</h1>
            </div>

            <div class="tracking-history">
              <div class="tracking-timeline">
                <h1>Timeline</h1>
              </div>

              <div class="tracking-route">
                <h1>Route Details</h1>
              </div>
            </div>
          </div>

          <div class="tracking-order-details-container">
            <div class="tracking-order-info">
              <h1>Order Info Details</h1>
            </div>

            <div class="tracking-support-info">
              <h1>Support</h1>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
